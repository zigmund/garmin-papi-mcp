# garmin-papi-mcp example configuration. See docs/configuration.md.

# Address the HTTP server binds to (nginx terminates TLS in front of it).
listen: 127.0.0.1:8788

# Public base URL as seen by claude.ai or ChatGPT. Absolute https origin, no
# path/query/fragment. http is accepted only for loopback hosts (localhost,
# 127.0.0.0/8, ::1) unless allow_insecure_http is set. The same rule applies to
# oauth.allowed_redirect_uris. garmin.base_url may use http only for loopback
# hosts, whatever allow_insecure_http says (every user's API key is sent
# there). The MCP endpoint is <public_url>/mcp.
public_url: https://garmin-papi-mcp.zigmund.xyz

# Accept plain http for non-loopback hosts in public_url and
# oauth.allowed_redirect_uris (never in garmin.base_url). Default false;
# enabling it logs a startup warning. Only for trusted networks.
# allow_insecure_http: false

log:
  level: info    # debug|info|warn|error (debug enables access log)
  format: json   # json|text

secrets:
  # Token encryption keys live in a file with one base64 (standard) key of
  # exactly 32 random bytes per line; '#' comments and blank lines are ignored.
  # Generate a key with: openssl rand -base64 32
  # The first key encrypts; the rest only decrypt (key rotation). Keys are read
  # only at startup: restart (not reload) after changing them. Adding a key
  # invalidates nothing; removing a key invalidates the tokens sealed under it.
  # Known-weak keys (all-zero, repeated-byte or incrementing patterns) are
  # rejected at startup.
  # This path is where the bundled systemd unit (LoadCredential=keys:...)
  # exposes the file; adjust it for other setups. A relative path is resolved
  # against this config file's directory.
  token_keys_file: /run/credentials/garmin-papi-mcp.service/keys
  # Alternative (set exactly one of token_keys / token_keys_file): inline keys.
  # token_keys:
  #   - "<output of: openssl rand -base64 32>"

# Durations: 0 or unset means the default; negative values are rejected.
oauth:
  access_token_ttl: 1h      # at most 24h; an access token cannot be revoked
  refresh_token_ttl: 720h   # idle lifetime of a refresh token
  # Absolute lifetime of a login from the code exchange; refreshing never extends it.
  # max_session_ttl: 2160h
  # Let the user pick the session lifetime on the authorize form ("Stay connected
  # for"). Up to 8 entries, each a whole number of hours of at least 1h (Go
  # durations have no d unit) or "unlimited" (no absolute end; refresh_token_ttl
  # still applies). The choice then replaces max_session_ttl for new logins.
  # Add "unlimited" to offer a session without an absolute end.
  session_choices: [720h, 2160h, 8760h]
  session_default: 2160h  # one of the choices; the first when unset
  code_ttl: 5m  # at most 10m
  allowed_redirect_uris:
    - https://claude.ai/api/mcp/auth_callback
    - https://claude.com/api/mcp/auth_callback
    - https://chatgpt.com/connector_platform_oauth_redirect
    # - http://localhost:53682/callback  # Claude Code (claude mcp add --callback-port 53682)

  # Optional operator notice, contact and terms of use on the authorize page
  # (plain text, HTML-escaped; the page is in English). contact: mailto: or
  # https:// URL, shown as a link. notice: text of at most 4 KiB; paragraphs
  # are split on blank lines. terms_file: path of a plain-text file (at most
  # 32 KiB, UTF-8, read at startup; a relative path is resolved against this
  # file) shown as "Terms of use"; the user must tick a required checkbox
  # before Authorize works. Write your own terms: terms.example.txt is only an
  # example and is not legal advice.
  # page:
  #   contact: "mailto:ops@example.org"
  #   notice: |
  #     Free, as is, no guarantees.
  #   terms_file: /etc/garmin-papi-mcp/terms.txt

  # Per-IP rate limiting of POST /oauth/register, /oauth/authorize and
  # /oauth/token, and of GET /oauth/authorize (429 + Retry-After). Zero or unset
  # values mean these defaults; they are generous because claude.ai and ChatGPT
  # use shared egress IPs.
  # rate_limit:
  #   disabled: false                                  # also turns off authorize_global, key_check_global and key_rejected
  #   register:  { per_minute: 60,  burst: 30 }
  #   token:     { per_minute: 300, burst: 100 }
  #   authorize: { per_minute: 30,  burst: 10 }
  #   authorize_form: { per_minute: 300, burst: 100 }  # GET /oauth/authorize
  #   # Unkeyed ceiling on all POST /oauth/authorize submissions together. When
  #   # unset it is derived from code_ttl so the code cache cannot fill.
  #   # authorize_global: { per_minute: 2500, burst: 2500 }
  #   # Unkeyed ceiling on Garmin key checks (every authorize POST that reaches
  #   # the check is one Garmin call, whatever the outcome).
  #   key_check_global: { per_minute: 300, burst: 100 }
  #   # Per-network (/24 IPv4, /48 IPv6) budget of keys Garmin rejects on the
  #   # authorize form; accepted keys cost nothing.
  #   key_rejected: { per_minute: 5, burst: 10 }

# Limits on the MCP endpoint (429 + Retry-After per IP / per grant, 503 when
# the global in-flight cap is reached). Every tool call is one or two Garmin
# requests, so these are modest. Zero or unset means these defaults, -1
# disables a single limit, "disabled: true" turns all of them off.
# limits:
#   ip:    { per_minute: 300, burst: 60 }   # per client IP, before the token is opened; refunded once it authenticates (caps unauthenticated/invalid traffic)
#   token: { per_minute: 60,  burst: 20 }   # per grant (one Personal API key, shared by all OAuth clients)
#   max_concurrent_per_token: 16            # in-flight requests per grant (a body being read counts)
#   max_in_flight: 1024                     # global in-flight requests (503 beyond; a body being read counts)
#   max_request_body: 65536                 # bytes (413 beyond), 1024 to 65536; cannot be disabled

# Garmin Connect Personal API client.
# garmin:
#   base_url: https://personal.connectapi.garmin.com  # https unless loopback (allow_insecure_http does not apply)
#   timeout: 20s                                      # per Garmin request, at most 5m

# Reverse proxies whose X-Forwarded-For / X-Real-IP are trusted for the client IP
# (access log and rate limiting). CIDRs or bare IPs; default: loopback only
# (127.0.0.0/8 and ::1/128); 0.0.0.0/0 and ::/0 are rejected.
# Setting it replaces the default, so keep loopback if nginx runs locally.
# trusted_proxies: ["127.0.0.0/8", "::1/128", "192.0.2.0/24"]

# Optional built-in TLS (both files or neither); leave commented out when a
# reverse proxy terminates TLS. Relative paths are resolved against this file's
# directory. The files are re-checked every reload_interval (0 or unset =
# default 1m) and on SIGHUP; a bad new pair keeps the old certificate.
# tls:
#   cert_file: /etc/letsencrypt/live/garmin-papi-mcp.zigmund.xyz/fullchain.pem
#   key_file: /etc/letsencrypt/live/garmin-papi-mcp.zigmund.xyz/privkey.pem
#   reload_interval: 1m
