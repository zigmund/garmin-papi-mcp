# Manual release workflow: test -> tag -> GoReleaser -> GitHub Release -> provenance.
# All actions are pinned to full commit SHAs (the comment gives the version).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, with a v prefix: vX.Y.Z or vX.Y.Z-rc.N'
        required: true
        type: string

permissions:
  contents: read

# Never run two releases at once; queue instead of cancelling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check ref and version
        env:
          REF: ${{ github.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Releases can only be cut from main (got $REF)"; exit 1
          fi
          pre='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          re="^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(${pre}(\.${pre})*))?\$"
          if [[ ! "$VERSION" =~ $re ]]; then
            echo "::error::Version '$VERSION' is not valid semver with a v prefix"; exit 1
          fi
          git check-ref-format "refs/tags/$VERSION" || { echo "::error::Invalid tag name"; exit 1; }
          # Fail closed: rc 0 = tag exists, rc 2 = absent, anything else = error.
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1 || rc=$?
          case "$rc" in
            2) echo "Tag $VERSION is free" ;;
            0) echo "::error::Tag $VERSION already exists"; exit 1 ;;
            *) echo "::error::Could not query remote tags (git exit $rc)"; exit 1 ;;
          esac

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check no secrets or agent files are tracked
        run: bash scripts/check-no-secrets.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  release:
    name: Tag and publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
    permissions:
      contents: write     # push tag, create release
      id-token: write     # Sigstore signing certificate for the attestation
      attestations: write # store the attestation
    steps:
      # Credentials are persisted deliberately: the tag push below needs them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      # No build cache in the release job: avoids cache poisoning of artifacts.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Create and push annotated tag
        id: tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
          # Only reached when the push succeeded; gates the recovery hint below.
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA build provenance for the published files (GoReleaser's dist/),
      # verifiable with `gh attestation verify` (see docs/releasing.md).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

      - name: Recovery instructions
        if: failure() && steps.tag.outputs.pushed == 'true'
        run: |
          echo "::error::Release failed after tag $VERSION was pushed. Clean up before re-running:"
          echo "  gh release delete \"$VERSION\" --repo \"$GITHUB_REPOSITORY\" --yes   # only if the release was created"
          echo "  git push origin \":refs/tags/$VERSION\"                                # delete the remote tag"
